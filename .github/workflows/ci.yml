name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  package-windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package unpacked Windows app
        run: npx electron-builder --win --x64 --dir --publish never
      - name: Check the packaged app size
        shell: pwsh
        run: |
          $asar = Get-Item "release/win-unpacked/resources/app.asar"
          "app.asar: {0:N1} MB" -f ($asar.Length / 1MB)
          if ($asar.Length -gt 10MB) { throw "app.asar unexpectedly large; check that renderer libraries stay in devDependencies" }
